# Production credentials must be supplied by the deployment environment.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
intercoach.jwt.secret=${JWT_SECRET:}

intercoach.execution.mode=docker
intercoach.execution.require-os-isolation=true

# Production databases must have an explicit Flyway migration history.
spring.flyway.baseline-on-migrate=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
