services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codecoach-postgres
    environment:
      POSTGRES_DB: codecoach
      POSTGRES_USER: codecoach
      POSTGRES_PASSWORD: codecoach
    ports:
      - "5432:5432"
    volumes:
      - codecoach_pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
    profiles:
      - app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/codecoach
      SPRING_DATASOURCE_USERNAME: codecoach
      SPRING_DATASOURCE_PASSWORD: codecoach
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-before-production-12345}
      INTERCOACH_EXECUTION_MODE: local
      INTERCOACH_REVIEW_QUEUE_ENABLED: ${INTERCOACH_REVIEW_QUEUE_ENABLED:-false}
      INTERCOACH_REVIEW_QUEUE_MAX_ATTEMPTS: ${INTERCOACH_REVIEW_QUEUE_MAX_ATTEMPTS:-3}
      INTERCOACH_REVIEW_QUEUE_LEASE_SECONDS: ${INTERCOACH_REVIEW_QUEUE_LEASE_SECONDS:-300}
      INTERCOACH_REVIEW_QUEUE_CONNECT_TIMEOUT_SECONDS: ${INTERCOACH_REVIEW_QUEUE_CONNECT_TIMEOUT_SECONDS:-5}
      INTERCOACH_REVIEW_QUEUE_RESPONSE_TIMEOUT_SECONDS: ${INTERCOACH_REVIEW_QUEUE_RESPONSE_TIMEOUT_SECONDS:-90}
      INTERCOACH_REVIEW_QUEUE_RETRY_DELAY_SECONDS: ${INTERCOACH_REVIEW_QUEUE_RETRY_DELAY_SECONDS:-30}
      INTERCOACH_REVIEW_QUEUE_POLL_INTERVAL_MS: ${INTERCOACH_REVIEW_QUEUE_POLL_INTERVAL_MS:-5000}
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  codecoach_pgdata:
